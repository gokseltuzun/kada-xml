name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: Premiere-to-FCPX-Windows.zip
          - os: macos-latest
            artifact: Premiere-to-FCPX-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - name: Test
        run: python tests/test_convert.py
      - name: Build
        run: pyinstaller --noconfirm --windowed --onefile --name "Premiere-to-FCPX" app.py
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Premiere-to-FCPX.exe -DestinationPath ${{ matrix.artifact }}
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent Premiere-to-FCPX.app ../${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
